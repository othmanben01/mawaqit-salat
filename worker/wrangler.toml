# Serveur de notifications de l'app « مواقيت الصلاة »
# Déployé par Cloudflare (Workers Builds) depuis le dossier /worker de ce dépôt.
name = "mawaqit-push"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://othmanben01.github.io"
SUBJECT = "https://othmanben01.github.io/mawaqit-salat/"

# Vérifie chaque minute s'il faut envoyer une notification
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
