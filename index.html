<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6A5B">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="مواقيت">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E6A5B'/%3E%3Cpath d='M40 14a18 18 0 1 0 10 32A15 15 0 1 1 40 14z' fill='%23fff'/%3E%3C/svg%3E">
<title>مواقيت الصلاة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column; a sky-tinted hero that follows the current prayer, white cards, 4-tab bottom bar */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --soft:#EBF0EE; --ink:#13201D; --muted:#66746F; --line:#E2E8E5;
  --accent:#0E6A5B; --on-accent:#FFFFFF; --accent-soft:#E0EFEA; --ok:#159A6B; --warn:#C24A33;
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --text:"Amiri","Traditional Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1311; --surface:#121E1B; --soft:#182824; --ink:#E7EFEC; --muted:#8FA09B; --line:#1F2F2B;
  --accent:#4DC0A5; --on-accent:#05211A; --accent-soft:#14302A; --ok:#4DD39F; --warn:#E5816B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1311; --surface:#121E1B; --soft:#182824; --ink:#E7EFEC; --muted:#8FA09B; --line:#1F2F2B;
  --accent:#4DC0A5; --on-accent:#05211A; --accent-soft:#14302A; --ok:#4DD39F; --warn:#E5816B; color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 92px}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

/* Hero */
.hero{border-radius:24px;color:#fff;padding:14px 18px 18px;background:linear-gradient(155deg,var(--sky1,#0E1630),var(--sky2,#27325E));
  display:flex;flex-direction:column;gap:2px;transition:background .8s}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;
  font-weight:600;font-size:14px;color:#fff;min-width:0;max-width:62%}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip svg{flex:none}
.hdate{font-size:12px;opacity:.85;text-align:left;line-height:1.35}
.next{margin-top:18px;font-size:14px;opacity:.9}
.next b{font-weight:700}
.cd{font-size:52px;font-weight:600;line-height:1.1;letter-spacing:.01em}
.at{font-size:14px;opacity:.9}
.track{height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:14px;overflow:hidden}
.track i{display:block;height:100%;background:#fff;border-radius:99px;transition:width 1s linear}

/* Generic */
.card{background:var(--surface);border-radius:18px;padding:6px 14px}
.card.pad{padding:16px}
.h{font-size:13px;font-weight:600;color:var(--muted);margin:4px 4px -4px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* Prayer list */
.p{display:flex;align-items:center;gap:12px;padding:12px 10px;margin:0 -10px;border-radius:14px}
.p.cur{background:var(--accent-soft)}
.p .nm{flex:1;font-weight:600;font-size:16px}
.p .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.p .tm{font-size:20px;font-weight:600}
.p.dim .nm,.p.dim .tm{color:var(--muted);font-weight:500}
.p.cur .tm,.p.cur .nm{color:var(--accent)}
.bell{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.bell[aria-pressed="true"]{color:var(--accent)}
.bell svg{width:20px;height:20px}
.spacer{width:38px}

/* Rak'at */
.rk{width:100%;border-collapse:collapse}
.rk th{font-size:12px;font-weight:600;color:var(--muted);padding:10px 4px 6px;text-align:center}
.rk th:first-child,.rk td:first-child{text-align:start}
.rk td{padding:10px 4px;border-top:1px solid var(--line);text-align:center;font-weight:600;font-size:16px}
.rk td:first-child{font-size:15px}
.rk .f{color:var(--accent)}
.rk .z{color:var(--line);font-weight:400}
.rk small{display:block;font-size:11px;font-weight:500;color:var(--muted)}

details.more summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:600}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:8px;height:8px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;margin-left:4px}
details.more[open] summary::after{transform:rotate(135deg)}
.tw{overflow-x:auto;padding-bottom:12px}
.mt{border-collapse:collapse;width:100%;min-width:430px;font-size:13px}
.mt th,.mt td{padding:6px 4px;text-align:center;white-space:nowrap}
.mt th{color:var(--muted);font-weight:600;font-size:12px}
.mt tr.today td{background:var(--accent-soft);color:var(--accent);font-weight:700}
.mt tr.today td:first-child{border-radius:0 8px 8px 0}.mt tr.today td:last-child{border-radius:8px 0 0 8px}

/* Qibla */
.qwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 8px 20px;text-align:center}
.dialbox{position:relative;width:min(290px,78vw);aspect-ratio:1;max-width:100%}
.dialbox svg{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid var(--ink)}
.dialbox.aligned .ring{stroke:var(--ok)}
.qbig{font-size:44px;font-weight:700;line-height:1}
.qmsg{font-size:16px;font-weight:600;min-height:1.5em}
.qmsg.ok{color:var(--ok)}
.qsub{font-size:13px;color:var(--muted)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.tip b{font-weight:700}
.tip .ic{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--accent)}

/* Athkar */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px 4px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.win{display:flex;align-items:center;gap:12px}
.win .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.win b{display:block;font-size:15px}
.live{display:inline-block;margin-inline-start:6px;font-size:11px;font-weight:700;background:var(--ok);color:#fff;border-radius:99px;padding:1px 8px;vertical-align:middle}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.dk{display:flex;gap:14px;align-items:center;width:100%;text-align:start;border:0;background:var(--surface);border-radius:18px;padding:16px;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s}
.dk:active{transform:scale(.985)}
.dk p{margin:0;font-family:var(--text);font-size:20px;line-height:1.95}
.dk .src{display:block;font-size:11.5px;color:var(--muted);margin-top:6px}
.cnt{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1%),var(--soft) 0)}
.cnt span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.dk.done{opacity:.55}
.dk.done .cnt span{background:var(--accent);color:var(--on-accent)}

/* Settings */
.field{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
select,input[type=text],input[type=number]{background:var(--soft);border:0;border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.adj{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.adj label{font-size:12px;font-weight:500}
.adj input{text-align:center;margin-top:3px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.sw{position:relative;width:48px;height:29px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(-19px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11.5px;color:var(--muted);font-weight:500}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 2px}
.sheet h2{margin:0;font-size:18px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.x{background:var(--soft);border:0;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
.clist{overflow-y:auto;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-radius:16px;padding:0 14px}
.crow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start}
.crow:last-child{border-bottom:0}
.crow small{color:var(--muted);font-size:12.5px}
.crow[aria-pressed="true"]{color:var(--accent);font-weight:700}
.locmsg{font-size:13px;color:var(--muted);text-align:center;min-height:1.2em}
.locmsg.err{color:var(--warn)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:40;
  max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast div{flex:1;min-width:0}
.toast b{display:block;font-size:16px}
.toast button{background:var(--accent);border:0;color:var(--on-accent);border-radius:10px;padding:7px 12px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  </div>
</nav>

/* ================= Astronomy ================= */
const R = Math.PI/180;
const dsin=d=>Math.sin(d*R), dcos=d=>Math.cos(d*R), dtan=d=>Math.tan(d*R);
const dasin=x=>Math.asin(x)/R, dacos=x=>Math.acos(x)/R, datan2=(y,x)=>Math.atan2(y,x)/R, dacot=x=>Math.atan(1/x)/R;
const fix=(a,b)=>{ a=a-b*Math.floor(a/b); return a<0?a+b:a; };
function julian(y,m,d){ if(m<=2){y-=1;m+=12;} const A=Math.floor(y/100),B=2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){ const D=jd-2451545, g=fix(357.529+0.98560028*D,360), q=fix(280.459+0.98564736*D,360);
  const L=fix(q+1.915*dsin(g)+0.020*dsin(2*g),360), e=23.439-0.00000036*D, RA=datan2(dcos(e)*dsin(L),dcos(L))/15;
  return {decl:dasin(dsin(e)*dsin(L)), eqt:q/15-fix(RA,24)}; }
function methodKey(loc){ return S.method==="auto" ? ((COUNTRIES[loc.cc]||{}).m || "mwl") : S.method; }
function computeDay(y,m,d,loc){
  const M=METHODS[methodKey(loc)], lat=loc.lat, lng=loc.lng, tz=tzOffset(loc.tz,y,m,d);
  const jd0=julian(y,m,d)-lng/(15*24);
  const midDay=t=>fix(12-sunPos(jd0+t).eqt,24);
  const angleTime=(a,t,ccw)=>{ const decl=sunPos(jd0+t).decl, noon=midDay(t);
    const c=(-dsin(a)-dsin(decl)*dsin(lat))/(dcos(decl)*dcos(lat)); if(c>1||c<-1) return NaN;
    const T=dacos(c)/15; return noon+(ccw?-T:T); };
  const asrTime=(f,t)=>{ const decl=sunPos(jd0+t).decl; return angleTime(-dacot(f+dtan(Math.abs(lat-decl))),t,false); };
  const init={fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18}; let t=Object.assign({},init);
  for(let i=0;i<2;i++){ const p={}; for(const k in t) p[k]=(isNaN(t[k])?init[k]:t[k])/24;
    t={fajr:angleTime(M.fajr,p.fajr,true), sunrise:angleTime(0.833,p.sunrise,true), dhuhr:midDay(p.dhuhr),
       asr:asrTime(S.asr,p.asr), sunset:angleTime(0.833,p.sunset,false), isha:M.ishaMin?NaN:angleTime(M.isha,p.isha,false)}; }
  for(const k in t) t[k]+=tz-lng/15;
  if(M.ishaMin) t.isha=t.sunset+M.ishaMin/60;
  const night=fix(t.sunrise-t.sunset,24);
  if(!isNaN(night)){ const fp=M.fajr/60*night; if(isNaN(t.fajr)||fix(t.sunrise-t.fajr,24)>fp) t.fajr=t.sunrise-fp;
    if(!M.ishaMin){ const ip=M.isha/60*night; if(isNaN(t.isha)||fix(t.isha-t.sunset,24)>ip) t.isha=t.sunset+ip; } }
  t.maghrib=t.sunset;
  const ma=M.adj||{};
  for(const k of ["fajr","sunrise","dhuhr","asr","maghrib","isha"]){ t[k]+=((ma[k]||0)+(+S.adj[k]||0))/60; t[k]=Math.round(t[k]*60)/60; }
  t.midnight=t.sunset+night/2; t.lastThird=t.sunset+night*2/3; t.tz=tz;
  return t;
}
const fmtCache={};
function partsIn(tz,date){
  const f=fmtCache[tz]||(fmtCache[tz]=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"}));
  const o={}; for(const p of f.formatToParts(date)) o[p.type]=p.value;
  return {y:+o.year,m:+o.month,d:+o.day,H:(+o.hour)%24,M:+o.minute,s:+o.second};
}
function tzOffset(tz,y,m,d){ try{ const u=Date.UTC(y,m-1,d,12), p=partsIn(tz,new Date(u)); return (Date.UTC(p.y,p.m-1,p.d,p.H,p.M)-u)/3600000; }catch(e){ return -new Date().getTimezoneOffset()/60; } }
function addDays(y,m,d,n){ const x=new Date(Date.UTC(y,m-1,d+n)); return [x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate()]; }
function distKm(a1,o1,a2,o2){ const p1=a1*R,p2=a2*R,dp=(a2-a1)*R,dl=(o2-o1)*R; const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2; return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
function qibla(loc){ const dl=KAABA.lng-loc.lng;
  return {bearing:fix(datan2(dsin(dl),dcos(loc.lat)*dtan(KAABA.lat)-dsin(loc.lat)*dcos(dl)),360), km:Math.round(distKm(loc.lat,loc.lng,KAABA.lat,KAABA.lng))}; }

function gregStr(y,m,d){ try{ return new Intl.DateTimeFormat("ar-MA-u-nu-latn",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,d,12))); }catch(e){ return ""; } }

function dialSvg(b){

  for(let a=0;a<360;a+=15){ const big=a%90===0; t+=`<line x1="150" y1="${big?28:32}" x2="150" y2="${big?42:39}" transform="rotate(${a} 150 150)" stroke="var(--muted)" stroke-width="${big?2.4:1.2}" stroke-linecap="round"/>`; }

function onOrientation(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number" && !isNaN(e.webkitCompassHeading)) h=e.webkitCompassHeading;
  else if(typeof e.alpha==="number" && (e.absolute || e.type==="deviceorientationabsolute")) h=360-e.alpha;
  if(h===null) return;
  const so=(screen.orientation&&typeof screen.orientation.angle==="number")?screen.orientation.angle:(window.orientation||0);
  h=fix(h+so,360);
  if(compass.smooth===null) compass.smooth=h; else { const d=((h-compass.smooth+540)%360)-180; compass.smooth=fix(compass.smooth+d*0.25,360); }
  const first=compass.heading===null; compass.heading=compass.smooth;
  if(tab!=="qibla") return;
  if(first){ render(); return; }
  if(!compass.raf) compass.raf=requestAnimationFrame(paintCompass);
}
function paintCompass(){
  compass.raf=0; const dial=document.getElementById("dial"); if(!dial) return;
  const q=qibla(loc), hd=compass.heading;
  dial.setAttribute("transform",`rotate(${(-hd).toFixed(1)} 150 150)`);
  const diff=((q.bearing-hd+540)%360)-180, ok=Math.abs(diff)<=4;
  const box=document.getElementById("dialbox"), msg=document.getElementById("qmsg");
  box.classList.toggle("aligned",ok); msg.classList.toggle("ok",ok);
  msg.textContent= ok ? "أنت في اتجاه القبلة ✓" : (diff>0 ? "استدر يميناً "+Math.round(diff)+"°" : "استدر يساراً "+Math.round(-diff)+"°");
  if(ok && !compass.aligned){ try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} }
  compass.aligned=ok;
}
async function startCompass(){
  const msg=document.getElementById("qmsg"), btn=document.getElementById("liveBtn");
  if(btn) btn.disabled=true; if(msg){ msg.className="qmsg"; msg.textContent="جارٍ تشغيل البوصلة…"; }
  try{
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission(); if(r!=="granted") throw new Error("denied");
    }
  }catch(e){ if(msg) msg.textContent="لم يُسمح باستعمال البوصلة."; if(btn) btn.disabled=false; return; }
  if(!compass.on){ compass.on=true;
    if("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute",onOrientation,true);
    window.addEventListener("deviceorientation",onOrientation,true); }
  setTimeout(()=>{ if(compass.heading===null && tab==="qibla"){ const m=document.getElementById("qmsg"), b=document.getElementById("liveBtn");
    if(m) m.textContent = IN_FRAME ? "البوصلة لا تعمل داخل معاينة Claude. افتح التطبيق من رابطه الخاص." : "لم نجد بوصلة في هذا الجهاز. استعمل الطريقة اليدوية.";
    if(b) b.disabled=false; } }, 2500);
}

  const sw=(id,on,label)=>`<div class="tg"><span>${label}</span><label class="sw"><input type="checkbox" id="${id}"${on?" checked":""} aria-label="${label}"><i></i></label></div>`;
  return `
  <div class="h">الموقع والحساب</div>
  <section class="card">
    <div class="field"><span class="lbl">الموقع</span><button class="btn soft block" data-city>${esc(loc.name)} — تغيير</button></div>
    <div class="field"><label for="method">طريقة الحساب</label><select id="method">${methods}</select></div>
    <div class="field"><label for="asr">وقت العصر</label><select id="asr"><option value="1"${S.asr===1?" selected":""}>الجمهور</option><option value="2"${S.asr===2?" selected":""}>الحنفية</option></select></div>
    <details class="more"><summary>تعديل يدوي بالدقائق</summary><div class="adj" style="padding-bottom:14px">${adj}</div></details>
  </section>
  <div class="h">التنبيهات</div>
  <section class="card">
    ${sw("n_on",S.notify.on,"تنبيه الأذان")}
    ${sw("n_sound",S.notify.sound,"الصوت")}
    ${sw("n_ath",S.notify.athkar,"تذكير الأذكار")}
    <div class="field"><label for="n_before">تذكير قبل الأذان</label><select id="n_before">${[0,5,10,15,30].map(v=>`<option value="${v}"${+S.notify.before===v?" selected":""}>${v?v+" دقائق":"بدون"}</option>`).join("")}</select></div>
    <div class="field"><span class="muted small">تعمل التنبيهات ما دام التطبيق مفتوحاً.</span><button class="btn soft" data-test>تجربة</button></div>
  </section>
  <div class="h">العرض</div>
  <section class="card">
    ${sw("h12",S.h12,"نظام 12 ساعة")}
    <div class="field"><label for="hadj">تعديل التاريخ الهجري</label><select id="hadj">${[-2,-1,0,1,2].map(v=>`<option value="${v}"${+S.hijriAdj===v?" selected":""}>${v>0?"+"+v:v} يوم</option>`).join("")}</select></div>
  </section>`;
}

function render(){
  renderHero();
  const v=document.getElementById("view"), mOpen=document.getElementById("monthD")?.open;
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${({prayer:viewPrayer,qibla:viewQibla,athkar:viewAthkar,settings:viewSettings})[tab]()}</div>`;
  if(mOpen&&document.getElementById("monthD")) document.getElementById("monthD").open=true;
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  if(tab==="qibla" && compass.heading!==null) paintCompass();
}

/* ================= Geolocation ================= */
function nearestCity(lat,lng){ let best=null; for(const c of CITIES){ const d=distKm(lat,lng,c[2],c[3]); if(!best||d<best.km) best={name:c[1],cc:c[4],km:d}; } return best; }
function getPos(){ return new Promise(res=>{
  if(!("geolocation" in navigator)){ res({err:2}); return; }
  try{ navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}), e=>res({err:e.code||2}), {enableHighAccuracy:false,timeout:15000,maximumAge:600000}); }
  catch(e){ res({err:2}); } }); }
async function useGPS(silent, msgEl){
  const say=(t,err)=>{ if(msgEl){ msgEl.textContent=t; msgEl.classList.toggle("err",!!err); } };
  say("جارٍ تحديد موقعك…");
  const r=await getPos();
  if(r.err){ if(!silent) say(IN_FRAME ? "تحديد الموقع لا يعمل داخل معاينة Claude. افتح التطبيق من رابطه الخاص، أو اختر مدينتك."
      : r.err===1 ? "لم يُسمح بالوصول إلى موقعك. فعّله من إعدادات المتصفح، أو اختر مدينتك." : "تعذّر تحديد موقعك. حاول مرة أخرى أو اختر مدينتك.", true);
    return false; }
  const near=nearestCity(r.lat,r.lng);
  let name = near && near.km<30 ? near.name : null, cc = near ? near.cc : "XX";
  if(!IN_FRAME){ try{ const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),5000);
      const j=await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${r.lat.toFixed(4)}&longitude=${r.lng.toFixed(4)}&localityLanguage=ar`,{signal:ctl.signal})).json();
      clearTimeout(to); name = j.city || j.locality || name; if(j.countryCode) cc=j.countryCode; }catch(e){} }
  S.gps={id:"gps", name:name||"موقعي الحالي", lat:+r.lat.toFixed(5), lng:+r.lng.toFixed(5), tz:DEVICE_TZ, cc};
  S.city="gps"; save(); full(); return true;
}

/* ================= City sheet ================= */
function openSheet(){
  const bg=document.createElement("div"); bg.className="sheet-bg"; bg.setAttribute("dir","rtl");
  const tzs=[...new Set([DEVICE_TZ,...Object.values(COUNTRIES).map(c=>c.tz)])];
  const c=S.custom||{name:"",lat:"",lng:"",tz:DEVICE_TZ};
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="اختيار الموقع">
    <div class="grab"></div>
    <div class="sheet-head"><h2>الموقع</h2><button class="x" data-close aria-label="إغلاق"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <button class="btn block" data-gps><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>استعمل موقعي الحالي</button>
    <div class="locmsg" id="locmsg"></div>
    <input type="text" id="q" placeholder="ابحث عن مدينة أو بلد" autocomplete="off" aria-label="بحث">
    <div class="clist" id="clist"></div>
    <details class="more"><summary>إحداثيات يدوية</summary>
      <div style="display:flex;flex-direction:column;gap:8px;padding-bottom:6px">
        <input type="text" id="c_name" value="${esc(c.name)}" placeholder="الاسم" aria-label="الاسم">
        <div class="cg"><input type="number" step="any" id="c_lat" value="${c.lat}" placeholder="خط العرض" aria-label="خط العرض"><input type="number" step="any" id="c_lng" value="${c.lng}" placeholder="خط الطول" aria-label="خط الطول"></div>
        <select id="c_tz" aria-label="المنطقة الزمنية">${tzs.map(z=>`<option${z===c.tz?" selected":""}>${z}</option>`).join("")}</select>
        <button class="btn soft" data-save>حفظ</button>
      </div></details>
  </div>`;
  document.getElementById("app").appendChild(bg);
  const draw=q=>{ q=(q||"").trim(); const out=[];
    for(const x of CITIES){ const cn=COUNTRIES[x[4]].n; if(q&&!x[1].includes(q)&&!cn.includes(q)&&!x[0].includes(q.toLowerCase())) continue;
      out.push(`<button class="crow" data-pick="${x[0]}" aria-pressed="${S.city===x[0]}"><span>${x[1]}</span><small>${cn}</small></button>`); }
    bg.querySelector("#clist").innerHTML=out.join("")||`<div class="crow muted">لا توجد نتيجة</div>`; };
  draw("");
  bg.querySelector("#q").addEventListener("input",e=>draw(e.target.value));
  bg.addEventListener("click",async e=>{
    if(e.target===bg||e.target.closest("[data-close]")){ bg.remove(); return; }
    const p=e.target.closest("[data-pick]"); if(p){ S.city=p.dataset.pick; save(); bg.remove(); full(); return; }
    if(e.target.closest("[data-gps]")){ const ok=await useGPS(false,bg.querySelector("#locmsg")); if(ok) bg.remove(); return; }
    if(e.target.closest("[data-save]")){
      const lat=parseFloat(bg.querySelector("#c_lat").value), lng=parseFloat(bg.querySelector("#c_lng").value), m=bg.querySelector("#locmsg");
      if(isNaN(lat)||lat<-66||lat>66||isNaN(lng)||lng<-180||lng>180){ m.textContent="أدخل خط عرض بين ‎-66 و 66 وخط طول بين ‎-180 و 180."; m.classList.add("err"); return; }
      const tz=bg.querySelector("#c_tz").value, near=nearestCity(lat,lng);
      S.custom={id:"custom",name:bg.querySelector("#c_name").value.trim()||"موقعي",lat,lng,tz,cc:near?near.cc:"XX"};
      S.city="custom"; save(); bg.remove(); full();
    }
  });
}

/* ================= Notifications ================= */
let audioCtx=null; const fired=new Set();
function ensureAudio(){ try{ if(!audioCtx){ const A=window.AudioContext||window.webkitAudioContext; if(A) audioCtx=new A(); } if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function chime(){ if(!audioCtx) return; try{ const t0=audioCtx.currentTime;
  [523.25,659.25,783.99,1046.5,783.99].forEach((f,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(), st=t0+i*0.42;
    o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.22,st+0.04); g.gain.exponentialRampToValueAtTime(0.0001,st+1.8);
    o.connect(g); g.connect(audioCtx.destination); o.start(st); o.stop(st+1.9); }); }catch(e){} }
function toast(title,body){ document.querySelectorAll(".toast").forEach(x=>x.remove());
  const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","alert"); el.setAttribute("dir","rtl");
  el.innerHTML=`<div><b></b><span></span></div><button>حسناً</button>`; el.querySelector("b").textContent=title; el.querySelector("span").textContent=body;
  el.querySelector("button").onclick=()=>el.remove(); document.getElementById("app").appendChild(el); }
function fire(title,body){ toast(title,body); if(S.notify.sound) chime();
  try{ navigator.vibrate&&navigator.vibrate([250,120,250]); }catch(e){}
  try{ if("Notification" in window && Notification.permission==="granted") new Notification(title,{body}); }catch(e){} }
function enableNotify(){ ensureAudio(); S.notify.on=true; save();
  try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission().catch(()=>{}); }catch(e){}
  chime(); render(); }
function checkNotify(){ if(!S.notify.on) return; const day=today.join("-"), ev=[];
  for(const k of FIVE){ if(!S.notify.per[k]) continue;
    ev.push({at:T[k],key:day+k,t:"حان وقت صلاة "+PNAME[k],b:loc.name+" · "+fmt(T[k])});
    if(+S.notify.before>0) ev.push({at:T[k]-S.notify.before/60,key:day+k+"b",t:PNAME[k]+" بعد "+S.notify.before+" دقائق",b:"الأذان على الساعة "+fmt(T[k])}); }
  if(S.notify.athkar){ ev.push({at:T.fajr+20/60,key:day+"am",t:"أذكار الصباح",b:"وقتها حتى الشروق "+fmt(T.sunrise)});
    ev.push({at:T.asr+20/60,key:day+"pm",t:"أذكار المساء",b:"وقتها حتى المغرب "+fmt(T.maghrib)}); }
  for(const e of ev) if(nowH>=e.at && nowH<e.at+2/60 && !fired.has(e.key)){ fired.add(e.key); fire(e.t,e.b); } }

/* ================= Events ================= */
const TABS=["prayer","qibla","athkar","settings"];
function go(t){ tab=t; try{ history.replaceState(null,"","#"+t); }catch(e){} render(); window.scrollTo({top:0}); }
document.getElementById("cityBtn").addEventListener("click",openSheet);
document.getElementById("nav").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(b) go(b.dataset.tab); });
document.getElementById("view").addEventListener("click",e=>{
  if(e.target.closest("[data-city]")){ openSheet(); return; }
  const bell=e.target.closest("[data-bell]");
  if(bell){ const k=bell.dataset.bell;
    if(!S.notify.on){ for(const x of FIVE) S.notify.per[x]=x===k; enableNotify(); return; }
    S.notify.per[k]=!S.notify.per[k]; save(); render(); return; }
  if(e.target.closest("[data-enable-notify]")){ for(const x of FIVE) S.notify.per[x]=true; enableNotify(); return; }
  if(e.target.closest("[data-test]")){ ensureAudio(); fire("حان وقت صلاة "+PNAME[nextPrayer().k],"تجربة التنبيه · "+loc.name); return; }
  if(e.target.closest("#liveBtn")){ startCompass(); return; }
  const a=e.target.closest("[data-ath]"); if(a){ athTab=a.dataset.ath; render(); return; }
  if(e.target.closest("[data-reset]")){ const st=athState(); athList(athTab).forEach(x=>delete st.c[x.id]); store.set("athkar",st); render(); return; }
  const dk=e.target.closest("[data-dk]");
  if(dk){ const st=athState(), id=dk.dataset.dk, max=+dk.dataset.max; let l=st.c[id]===undefined?max:st.c[id];
    l = l>0 ? l-1 : max; st.c[id]=l; store.set("athkar",st);
    try{ navigator.vibrate&&navigator.vibrate(l===0?[30,50,30]:12); }catch(err){}
    const y=window.scrollY; render(); window.scrollTo({top:y}); }
});
document.getElementById("view").addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="method") S.method=el.value;
  else if(el.id==="asr") S.asr=+el.value;
  else if(el.dataset.adj) S.adj[el.dataset.adj]=Math.max(-60,Math.min(60,parseInt(el.value)||0));
  else if(el.id==="n_on"){ if(el.checked){ enableNotify(); return; } S.notify.on=false; }
  else if(el.id==="n_sound"){ S.notify.sound=el.checked; if(el.checked) ensureAudio(); }
  else if(el.id==="n_ath") S.notify.athkar=el.checked;
  else if(el.id==="n_before") S.notify.before=+el.value;
  else if(el.id==="hadj") S.hijriAdj=+el.value;
  else if(el.id==="h12") S.h12=el.checked;
  else return;
  save(); full();
});

/* ================= Clock ================= */
let lastKey="";
function updateNow(){ const p=partsIn(loc.tz,new Date()); nowH=p.H+p.M/60+p.s/3600;
  const dk=p.y+"-"+p.m+"-"+p.d; if(dk!==today.join("-")){ refreshDay(); return true; }
  const mk=dk+" "+p.H+":"+p.M; if(mk!==lastKey){ lastKey=mk; return true; } return false; }
function full(){ refreshDay(); updateNow(); render(); tick(); }
setInterval(()=>{ if(updateNow()){ if(tab==="prayer"){ const y=window.scrollY; render(); window.scrollTo({top:y}); } else renderHero(); checkNotify(); } tick(); }, 1000);

const h0=(location.hash||"").replace("#",""); if(TABS.includes(h0)) tab=h0;
window.addEventListener("hashchange",()=>{ const x=location.hash.replace("#",""); if(x!==tab&&TABS.includes(x)){ tab=x; render(); } });
full();
// Location on open: refresh GPS position if chosen, or try once on first run (outside the Claude preview)
if(!IN_FRAME && (S.city==="gps" || FIRST_RUN)) useGPS(true,null);
</script>
