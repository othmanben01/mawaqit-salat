<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B6EA8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="مواقيت">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>مواقيت الصلاة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Palette: calm, serene blues. Layout: one calm column; a sky-tinted hero that follows the current prayer, white cards, 5-tab bottom bar */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --soft:#EAF0F7; --ink:#15233A; --muted:#66758C; --line:#DFE7F1;
  --accent:#3B6EA8; --on-accent:#FFFFFF; --accent-soft:#E2ECF8; --ok:#2E8BC0; --warn:#C0574A; --gold:#9A7B3C; --gold-soft:#F4EFE3;
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --text:"Amiri","Traditional Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1422; --surface:#121D2E; --soft:#182538; --ink:#E6EDF7; --muted:#8C9AB0; --line:#1F2C42;
  --accent:#7EB1E8; --on-accent:#0A1628; --accent-soft:#162A44; --ok:#6CB8E6; --warn:#E58A7B; --gold:#D3B26E; --gold-soft:#262214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1422; --surface:#121D2E; --soft:#182538; --ink:#E6EDF7; --muted:#8C9AB0; --line:#1F2C42;
  --accent:#7EB1E8; --on-accent:#0A1628; --accent-soft:#162A44; --ok:#6CB8E6; --warn:#E58A7B; --gold:#D3B26E; --gold-soft:#262214; color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg)}
/* App shell: only #scroller scrolls, so the tab bar never moves (iOS bounces fixed bars while scrolling). */
html{height:100%;box-sizing:border-box;overflow:hidden;overscroll-behavior:none}
body{height:100%;overflow:hidden;display:flex;flex-direction:column;overscroll-behavior:none}
#scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
body{margin:0;color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.stack{display:flex;flex-direction:column;gap:14px}

/* Hero */
.hero{border-radius:24px;color:#fff;padding:14px 18px 18px;background:linear-gradient(155deg,var(--sky1,#0E1A30),var(--sky2,#22365A));
  display:flex;flex-direction:column;gap:2px;transition:background .8s}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;
  font-weight:600;font-size:14px;color:#fff;min-width:0;max-width:62%}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip svg{flex:none}
.hdate{font-size:12px;opacity:.85;text-align:left;line-height:1.35}
.next{margin-top:18px;font-size:14px;opacity:.9}
.next b{font-weight:700}
.cd{font-size:52px;font-weight:600;line-height:1.1;letter-spacing:.01em}
.at{font-size:14px;opacity:.9}
.track{height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:14px;overflow:hidden}
.track i{display:block;height:100%;background:#fff;border-radius:99px;transition:width 1s linear}

/* Generic */
.card{background:var(--surface);border-radius:18px;padding:6px 14px}
.card.pad{padding:16px}
.h{font-size:13px;font-weight:600;color:var(--muted);margin:4px 4px -4px}
.grow{flex:1;min-width:0}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;text-decoration:none}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--gold-soft);color:var(--gold)}

/* Prayer list */
.p{display:flex;align-items:center;gap:10px;padding:10px;margin:0 -10px;border-radius:14px}
.p.cur{background:var(--accent-soft)}
.p .nm{flex:1;font-weight:600;font-size:16px;min-width:0}
.p .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.p .tm{font-size:20px;font-weight:600}
.p.dim .nm,.p.dim .tm{color:var(--muted);font-weight:500}
.p.cur .tm,.p.cur .nm{color:var(--accent)}
.bell{width:36px;height:36px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.bell[aria-pressed="true"]{color:var(--accent)}
.bell svg{width:20px;height:20px}
.spacer{width:36px;flex:none}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:transparent;transition:background .15s,border-color .15s}
.chk svg{width:16px;height:16px}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk:disabled{opacity:.35;cursor:default}
.chk-sp{width:30px;flex:none}

/* Tracker */
.trk{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--soft) 0)}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px}
.week{display:flex;gap:6px;margin-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;max-width:28px;height:28px;border-radius:8px;background:var(--soft);position:relative;overflow:hidden}
.week i b{position:absolute;inset:auto 0 0 0;background:var(--ok)}
.week .tdy{color:var(--ink);font-weight:700}
.qada{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-bottom:14px}
.qada div{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:8px 4px}
.qada b{font-size:18px}
.qada .qb{display:flex;gap:6px}
.qada button{width:28px;height:28px;border-radius:8px;border:0;background:var(--surface);font-weight:700;font-size:16px;line-height:1}

/* Friday */
.fri{background:var(--gold-soft);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fri h3{margin:0;font-size:16px;color:var(--gold)}
.fri ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}

/* Rak'at */
.rk{width:100%;border-collapse:collapse}
.rk th{font-size:12px;font-weight:600;color:var(--muted);padding:10px 4px 6px;text-align:center}
.rk th:first-child,.rk td:first-child{text-align:start}
.rk td{padding:10px 4px;border-top:1px solid var(--line);text-align:center;font-weight:600;font-size:16px}
.rk td:first-child{font-size:15px}
.rk .f{color:var(--accent)}
.rk .z{color:var(--line);font-weight:400}
.rk small{display:block;font-size:11px;font-weight:500;color:var(--muted)}

details.more summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:600}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:8px;height:8px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;margin-left:4px}
details.more[open] summary::after{transform:rotate(135deg)}
.tw{overflow-x:auto;padding-bottom:12px}
.mt{border-collapse:collapse;width:100%;min-width:430px;font-size:13px}
.mt th,.mt td{padding:6px 4px;text-align:center;white-space:nowrap}
.mt th{color:var(--muted);font-weight:600;font-size:12px}
.mt tr.today td{background:var(--accent-soft);color:var(--accent);font-weight:700}
.mt tr.today td:first-child{border-radius:0 8px 8px 0}.mt tr.today td:last-child{border-radius:8px 0 0 8px}

/* Qibla */
.qwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 8px 20px;text-align:center}
.dialbox{position:relative;width:min(290px,78vw);aspect-ratio:1;max-width:100%}
.dialbox svg{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid var(--ink)}
.dialbox.aligned .ring2{stroke:var(--ok)}
.qbig{font-size:44px;font-weight:700;line-height:1}
.qmsg{font-size:16px;font-weight:600;min-height:1.5em}
.qmsg.ok{color:var(--ok)}
.qsub{font-size:13px;color:var(--muted)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.tip b{font-weight:700}
.tip .ic{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--accent)}

/* Segmented control */
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px 2px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Athkar */
.win{display:flex;align-items:center;gap:12px}
.win .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.win b{display:block;font-size:15px}
.live{display:inline-block;margin-inline-start:6px;font-size:11px;font-weight:700;background:var(--ok);color:#fff;border-radius:99px;padding:1px 8px;vertical-align:middle}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.dk{display:flex;gap:14px;align-items:center;width:100%;text-align:start;border:0;background:var(--surface);border-radius:18px;padding:16px;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s}
.dk:active{transform:scale(.985)}
.dk p{margin:0;font-family:var(--text);font-size:20px;line-height:1.95}
.dk .src{display:block;font-size:11.5px;color:var(--muted);margin-top:6px}
.cnt{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1%),var(--soft) 0)}
.cnt span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.dk.done{opacity:.55}
.dk.done .cnt span{background:var(--accent);color:var(--on-accent)}

/* Tasbih */
.tb-phr{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.tb-phr::-webkit-scrollbar{display:none}
.tb-phr button{flex:none;border:0;background:var(--surface);border-radius:99px;padding:8px 14px;font-family:var(--text);font-size:17px;color:var(--muted)}
.tb-phr button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tb-main{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 8px}
.tb-word{font-family:var(--text);font-size:30px;line-height:1.4;text-align:center;min-height:1.4em}
.tb-btn{--p:0;width:min(250px,70vw);aspect-ratio:1;max-width:100%;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .07s}
.tb-btn:active{transform:scale(.97)}
.tb-btn span{width:86%;height:86%;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tb-btn b{font-size:64px;font-weight:600;line-height:1}
.tb-btn small{font-size:13px;color:var(--muted)}
.tb-tg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tb-tg button{border:0;background:var(--soft);border-radius:10px;padding:6px 14px;font-weight:600;color:var(--muted)}
.tb-tg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb-stats{display:flex;justify-content:space-around;width:100%;text-align:center;font-size:12.5px;color:var(--muted)}
.tb-stats b{display:block;font-size:18px;color:var(--ink)}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 8px}
.cal-head h2{margin:0;font-size:18px;text-align:center}
.cal-head h2 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.navb{width:38px;height:38px;border-radius:12px;border:0;background:var(--soft);display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-bottom:12px}
.cal .wd{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600;padding:4px 0}
.cal .c{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;min-width:0}
.cal .c b{font-size:16px;font-weight:600;line-height:1.1}
.cal .c small{font-size:10px;color:var(--muted)}
.cal .c.white{background:var(--soft)}
.cal .c.ev{background:var(--gold-soft)}
.cal .c.ev b{color:var(--gold)}
.cal .c.tdy{background:var(--accent);}
.cal .c.tdy b,.cal .c.tdy small{color:var(--on-accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.evl{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.evl:last-child{border-bottom:0}
.evl .dt{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--gold-soft);color:var(--gold);padding:4px 0;line-height:1.15}
.evl .dt b{display:block;font-size:17px}
.evl .dt small{font-size:10.5px}
.ram{background:linear-gradient(150deg,#1C3358,#3E6596);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.ram b.big{font-size:34px;line-height:1.1}
.ram .muted{color:rgba(255,255,255,.8)}
.imsak{border-collapse:collapse;width:100%;min-width:360px;font-size:13px}
.imsak th,.imsak td{padding:7px 4px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.imsak th{color:var(--muted);font-weight:600;font-size:12px}
.imsak tr.today td{background:var(--accent-soft);color:var(--accent);font-weight:700}

/* Settings */
.field{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
select,input[type=text],input[type=number],input[type=search]{background:var(--soft);border:0;border-radius:12px;padding:11px 12px;width:100%;min-width:0;box-sizing:border-box}
.adj{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.adj label{font-size:12px;font-weight:500}
.adj input{text-align:center;margin-top:3px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg small{display:block;color:var(--muted);font-size:12px}
.sw{position:relative;width:48px;height:29px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(-19px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.push{display:flex;flex-direction:column;gap:10px;padding:14px 0}
.push-top{display:flex;align-items:center;gap:12px}
.push-top .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.push-top b{display:block}
.push .row2{display:flex;gap:8px;flex-wrap:wrap}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14px;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:9px;background:var(--soft);color:var(--accent);font-weight:700;display:grid;place-items:center;flex:none;font-size:13px}
.ios-share{display:inline-block;vertical-align:-3px}
.alist{display:flex;flex-direction:column;background:var(--soft);border-radius:14px;padding:4px;margin-top:4px}
.arow{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:11px;padding:10px;text-align:start;width:100%}
.arow b{display:block;font-size:15px}
.arow small{display:block;font-size:12px;color:var(--muted)}
.arow .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;box-sizing:border-box}
.arow[aria-checked="true"]{background:var(--surface)}
.arow[aria-checked="true"] .rad{border:6px solid var(--accent)}
.arow .pl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.arow.playing .pl{background:var(--accent);color:var(--on-accent)}
.credits{margin:0 0 12px;padding-inline-start:18px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.adhan-box{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.adhan-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.note{font-size:12.5px;color:var(--muted)}
.note.err{color:var(--warn)}

/* Nav */
.nav{position:relative;flex:none;z-index:20;background:var(--surface);
  border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500;min-width:0}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 2px}
.sheet h2{margin:0;font-size:18px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.x{background:var(--soft);border:0;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
.clist{overflow-y:auto;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-radius:16px;padding:0 14px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start}
.crow:last-child{border-bottom:0}
.crow small{color:var(--muted);font-size:12.5px;text-align:left}
.crow[aria-pressed="true"]{color:var(--accent);font-weight:700}
.clabel{font-size:12px;font-weight:600;color:var(--muted);padding:10px 0 2px}
.locmsg{font-size:13px;color:var(--muted);text-align:center;min-height:1.2em}
.locmsg.err{color:var(--warn)}
.locmsg.ok{color:var(--ok)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.live-adhan{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:24px;
  background:linear-gradient(160deg,var(--sky1,#102038),var(--sky2,#2B4C7E));color:#fff;text-align:center}
.la-in{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(340px,100%)}
.la-in b{font-size:30px;line-height:1.3}
.la-in span{opacity:.85}
.la-in .btn{margin-top:18px;background:#fff;color:#16304F}
.la-ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);animation:la 2s ease-in-out infinite}
@keyframes la{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.25)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
@media (prefers-reduced-motion: reduce){.la-ring{animation:none}}
.bgst{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:600;box-sizing:border-box}
.bgst.on{background:var(--accent-soft);color:var(--accent)}
.bgst.on i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:bgp 2s ease-in-out infinite}
.bgst.off{background:var(--gold-soft);color:var(--gold)}
@keyframes bgp{50%{opacity:.3}}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:40;

.toast div{flex:1;min-width:0}
.toast b{display:block;font-size:16px}
.toast button{background:var(--accent);border:0;color:var(--on-accent);border-radius:10px;padding:7px 12px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const R = Math.PI/180;
const dsin=d=>Math.sin(d*R), dcos=d=>Math.cos(d*R), dtan=d=>Math.tan(d*R);

  const L=fix(q+1.915*dsin(g)+0.020*dsin(2*g),360), e=23.439-0.00000036*D, RA=datan2(dcos(e)*dsin(L),dcos(L))/15;
  return {decl:dasin(dsin(e)*dsin(L)), eqt:q/15-fix(RA,24)}; }

function computeDay(y,m,d,loc){
  const M=METHODS[methodKey(loc)], lat=loc.lat, lng=loc.lng, tz=tzOffset(loc.tz,y,m,d);
  const jd0=julian(y,m,d)-lng/(15*24);
  const midDay=t=>fix(12-sunPos(jd0+t).eqt,24);
  const angleTime=(a,t,ccw)=>{ const decl=sunPos(jd0+t).decl, noon=midDay(t);
    const c=(-dsin(a)-dsin(decl)*dsin(lat))/(dcos(decl)*dcos(lat)); if(c>1||c<-1) return NaN;
    const T=dacos(c)/15; return noon+(ccw?-T:T); };
  const asrTime=(f,t)=>{ const decl=sunPos(jd0+t).decl; return angleTime(-dacot(f+dtan(Math.abs(lat-decl))),t,false); };
  const init={fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18}; let t=Object.assign({},init);
  for(let i=0;i<2;i++){ const p={}; for(const k in t) p[k]=(isNaN(t[k])?init[k]:t[k])/24;
    t={fajr:angleTime(M.fajr,p.fajr,true), sunrise:angleTime(0.833,p.sunrise,true), dhuhr:midDay(p.dhuhr),
       asr:asrTime(S.asr,p.asr), sunset:angleTime(0.833,p.sunset,false), isha:M.ishaMin?NaN:angleTime(M.isha,p.isha,false)}; }

    if(!M.ishaMin){ const ip=M.isha/60*night; if(isNaN(t.isha)||fix(t.isha-t.sunset,24)>ip) t.isha=t.sunset+ip; } }

function dialSvg(b){
  let t="";

function onOrientation(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number" && !isNaN(e.webkitCompassHeading)) h=e.webkitCompassHeading;
  else if(typeof e.alpha==="number" && (e.absolute || e.type==="deviceorientationabsolute")) h=360-e.alpha;
  if(h===null) return;
  const so=(screen.orientation&&typeof screen.orientation.angle==="number")?screen.orientation.angle:(window.orientation||0);
  h=fix(h+so,360);
  if(compass.smooth===null) compass.smooth=h; else { const d=((h-compass.smooth+540)%360)-180; compass.smooth=fix(compass.smooth+d*0.25,360); }
  const first=compass.heading===null; compass.heading=compass.smooth;
  if(tab!=="qibla") return;
  if(first){ render(); return; }
  if(!compass.raf) compass.raf=requestAnimationFrame(paintCompass);
}
function paintCompass(){
  compass.raf=0; const dial=document.getElementById("dial"); if(!dial) return;
  const q=qibla(loc), hd=compass.heading;
  dial.setAttribute("transform",`rotate(${(-hd).toFixed(1)} 150 150)`);
  const diff=((q.bearing-hd+540)%360)-180, ok=Math.abs(diff)<=4;
  const box=document.getElementById("dialbox"), msg=document.getElementById("qmsg");
  box.classList.toggle("aligned",ok); msg.classList.toggle("ok",ok);
  msg.textContent= ok ? "أنت في اتجاه القبلة ✓" : (diff>0 ? "استدر يميناً "+Math.round(diff)+"°" : "استدر يساراً "+Math.round(-diff)+"°");
  if(ok && !compass.aligned){ try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} }
  compass.aligned=ok;
}
async function startCompass(){

  if(btn) btn.disabled=true; if(msg){ msg.className="qmsg"; msg.textContent="جارٍ تشغيل البوصلة…"; }
  try{
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission(); if(r!=="granted") throw new Error("denied");
    }
  }catch(e){ if(msg) msg.textContent="لم يُسمح باستعمال البوصلة."; if(btn) btn.disabled=false; return; }
  if(!compass.on){ compass.on=true;
    if("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute",onOrientation,true);
    window.addEventListener("deviceorientation",onOrientation,true); }
  setTimeout(()=>{ if(compass.heading===null && tab==="qibla"){ const m=document.getElementById("qmsg"), b=document.getElementById("liveBtn");

}

/* ---- Hijri calendar & Ramadan ---- */
function monthStartOf(g){ return addDays(...g, -(hParts(g).hd-1)); }
function shiftMonth(start,n){ let s=start;
  for(let i=0;i<n;i++){ let x=addDays(...s,28); let guard=0; while(hParts(x).hd!==1 && guard++<5) x=addDays(...x,1); s=x; }
  for(let i=0;i<-n;i++){ const prev=addDays(...s,-1); s=addDays(...prev,-(hParts(prev).hd-1)); }
  return s; }
function monthDays(start){ const out=[]; let g=start;
  do{ out.push({g,h:hParts(g)}); g=addDays(...g,1); } while(hParts(g).hd!==1 && out.length<31);
  return out; }
function upcoming(limit){ const out=[]; let ram=null;
  for(let i=0;i<400 && (out.length<limit || !ram);i++){ const g=addDays(...today,i), h=hParts(g), k=h.hm+"-"+h.hd;
    if(HDAYS[k] && out.length<limit) out.push({g,h,name:HDAYS[k],days:i});
    if(!ram && h.hm===9 && h.hd===1) ram={g,days:i}; }
  return {events:out, ram}; }
function viewCalendar(){
  const start=shiftMonth(monthStartOf(today),calShift), days=monthDays(start), h0=days[0].h, tk=dayKey(today);
  const first=(dow(start)+6)%7; // Monday first
  const g1=days[0].g, g2=days[days.length-1].g;
  const gLabel = g1[1]===g2[1] ? GM[g1[1]-1]+" "+g1[0] : GM[g1[1]-1]+" – "+GM[g2[1]-1]+" "+g2[0];
  let cells=["ن","ث","ر","خ","ج","س","ح"].map(d=>`<div class="wd">${d}</div>`).join("");
  for(let i=0;i<first;i++) cells+=`<div></div>`;
  for(const d of days){ const k=d.h.hm+"-"+d.h.hd, ev=HDAYS[k], white=d.h.hd>=13&&d.h.hd<=15;
    cells+=`<div class="c ${dayKey(d.g)===tk?"tdy":""} ${ev?"ev":white?"white":""}" title="${ev?esc(ev):""}"><b class="num">${d.h.hd}</b><small class="num">${d.g[2]}</small></div>`; }
  const {events, ram} = upcoming(6);
  const evl=events.map(e=>`<div class="evl"><span class="dt"><b class="num">${e.h.hd}</b><small>${HM[e.h.hm-1]}</small></span>
    <span class="grow"><b>${e.name}</b><div class="small muted">${gregStr(e.g)} ${e.g[0]}</div></span>
    <span class="pill ${e.days===0?"on":""}">${e.days===0?"اليوم":e.days===1?"غداً":"بعد "+daysWord(e.days)}</span></div>`).join("");
  return `
  <section class="card">
    <div class="cal-head">
      <button class="navb" data-cal="-1" aria-label="الشهر السابق"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
      <h2>${HM[h0.hm-1]} ${h0.hy}<small>${gLabel}</small></h2>
      <button class="navb" data-cal="1" aria-label="الشهر التالي"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>اليوم</span><span><i style="background:var(--gold-soft);outline:1px solid var(--gold)"></i>مناسبة</span><span><i style="background:var(--soft)"></i>الأيام البيض</span>
      ${calShift?`<button class="link small" data-cal="0">العودة إلى الشهر الحالي</button>`:""}</div>
  </section>
  ${ramadanCard(ram)}
  <div class="h">المناسبات القادمة</div>
  <section class="card">${evl||`<div class="evl muted">لا توجد مناسبات قريبة</div>`}</section>
  <p class="note" style="margin:0 4px">التاريخ الهجري حسب تقويم أم القرى، وقد يختلف بيوم عن رؤية الهلال في المغرب. يمكنك تعديله من الإعدادات.</p>`;
}
function ramadanCard(ram){
  const inRam=isRamadan();
  let start, title, sub;
  if(inRam){ const h=hParts(today); start=monthStartOf(today); title=`رمضان مبارك — اليوم ${h.hd}`;
    const dur=T.maghrib-T.fajr; sub=`الإمساك <b class="num">${fmt(T.fajr)}</b> · الإفطار <b class="num">${fmt(T.maghrib)}</b> · الصيام <span class="num">${Math.floor(dur)}س ${Math.round((dur%1)*60)}د</span>`; }
  else if(ram){ start=ram.g; title=`رمضان بعد <span class="num">${ram.days}</span> ${ram.days>10?"يوماً":"أيام"}`; sub=`يبدأ تقريباً ${gregStr(ram.g)} ${ram.g[0]}`; }
  else return "";
  const days=monthDays(start), tk=dayKey(today);
  const rows=days.map((d,i)=>{ const t=computeDay(d.g[0],d.g[1],d.g[2],loc), dur=t.maghrib-t.fajr;
    return `<tr class="${dayKey(d.g)===tk?"today":""}"><td class="num">${i+1}</td><td>${WD[dow(d.g)]}</td><td class="num">${d.g[2]}/${d.g[1]}</td><td class="num">${fmt(t.fajr)}</td><td class="num">${fmt(t.maghrib)}</td><td class="num">${Math.floor(dur)}:${String(Math.round((dur%1)*60)).padStart(2,"0")}</td></tr>`; }).join("");
  return `<section class="ram"><span class="small muted">رمضان ${days[0].h.hy}</span><b class="big">${title}</b><span class="small">${sub}</span></section>
  <section class="card"><details class="more" id="imsakD"><summary>إمساكية رمضان · ${esc(loc.name)}</summary>
    <div class="tw"><table class="imsak"><thead><tr><th>اليوم</th><th></th><th>التاريخ</th><th>الإمساك (الفجر)</th><th>الإفطار (المغرب)</th><th>الصيام</th></tr></thead><tbody>${rows}</tbody></table></div>
  </details></section>`;
}

/* ================= Location ================= */
function nearestCity(lat,lng){ let best=null; for(const c of CITIES){ const d=distKm(lat,lng,c[2],c[3]); if(!best||d<best.km) best={name:c[1],cc:c[4],km:d}; } return best; }
function getPos(fresh){ return new Promise(res=>{
  if(!("geolocation" in navigator)){ res({err:2}); return; }
  try{ navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}), e=>res({err:e.code||2}),
    {enableHighAccuracy:true,timeout:20000,maximumAge:fresh?0:30*60000}); }
  catch(e){ res({err:2}); } }); }
async function reverseGeo(lat,lng){
  if(IN_FRAME) return null;
  try{ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),6000);
    const j=await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat.toFixed(5)}&longitude=${lng.toFixed(5)}&localityLanguage=ar`,{signal:ctl.signal})).json();
    clearTimeout(to);
    const city=j.city||j.locality||"", area=(j.locality&&j.locality!==city)?j.locality:"";
    return {city, area, cc:j.countryCode||""};
  }catch(e){ return null; }
}
async function useGPS(silent,msgEl){
  const say=(t,cls)=>{ if(msgEl){ msgEl.textContent=t; msgEl.className="locmsg"+(cls?" "+cls:""); } };
  say("جارٍ تحديد موقعك…");
  const r=await getPos(!silent);
  if(r.err){ if(!silent) say(IN_FRAME ? "تحديد الموقع لا يعمل داخل معاينة Claude. افتح التطبيق من رابطه الخاص، أو اختر مدينتك."
      : r.err===1 ? "لم يُسمح بالوصول إلى موقعك. على iPhone: الإعدادات ← الخصوصية ← خدمات الموقع ← Safari ← أثناء الاستخدام." : "تعذّر تحديد موقعك. حاول مرة أخرى أو ابحث عن مدينتك.", "err");
    return false; }
  const near=nearestCity(r.lat,r.lng), g=await reverseGeo(r.lat,r.lng);
  const name=(g&&g.city) || (near&&near.km<25?near.name:"") || "موقعي الحالي";
  const cc=(g&&g.cc) || (near&&near.km<300?near.cc:"XX");
  S.gps={id:"gps", name, area:(g&&g.area)||"", lat:+r.lat.toFixed(5), lng:+r.lng.toFixed(5), acc:Math.round(r.acc||0), tz:tzFor(cc), cc, at:Date.now()};
  S.city="gps"; save(); full();
  say(`تم تحديد موقعك: ${name}${S.gps.area?" · "+S.gps.area:""}`, "ok");
  return true;
}
let geoTimer=0, geoSeq=0;
async function searchOnline(q){
  if(IN_FRAME) return [];
  const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=ar&format=json`)).json();
  return (j.results||[]).filter(r=>r.timezone).map(r=>({name:r.name, sub:[r.admin1,r.country].filter(Boolean).join("، "), lat:r.latitude, lng:r.longitude, tz:r.timezone, cc:r.country_code||"XX"}));
}

      </div></details>
  </div>`;
  document.getElementById("app").appendChild(bg);

    for(const x of CITIES){ const cn=COUNTRIES[x[4]].n; if(q&&!x[1].includes(q)&&!cn.includes(q)&&!x[0].includes(q.toLowerCase())) continue;
      out.push(`<button class="crow" data-pick="${x[0]}" aria-pressed="${S.city===x[0]}"><span>${x[1]}</span><small>${cn}</small></button>`); }
    let html=out.join("");
    if(q.length>=2){
      if(net==="loading") html+=`<div class="clabel">جارٍ البحث…</div>`;
      else if(online.length) html+=`<div class="clabel">نتائج من العالم</div>`+online.map((r,i)=>`<button class="crow" data-online="${i}"><span>${esc(r.name)}</span><small>${esc(r.sub)}</small></button>`).join("");
      else if(net==="none" && !out.length) html+=`<div class="crow muted">لا توجد نتيجة. جرّب الاسم بالفرنسية أو الإنجليزية.</div>`;
    }
    bg.querySelector("#clist").innerHTML=html||`<div class="crow muted">لا توجد نتيجة</div>`; };
  draw("");
  bg.querySelector("#q").addEventListener("input",e=>{
    const q=e.target.value.trim(); online=[]; draw(q, q.length>=2?"loading":""); clearTimeout(geoTimer);
    if(q.length<2) return;

  });
  bg.addEventListener("click",async e=>{

    const o=e.target.closest("[data-online]");

    if(e.target.closest("[data-gps]")){ const ok=await useGPS(false,bg.querySelector("#locmsg")); if(ok) setTimeout(()=>bg.remove(),900); return; }
    if(e.target.closest("[data-save]")){
      const lat=parseFloat(bg.querySelector("#c_lat").value), lng=parseFloat(bg.querySelector("#c_lng").value), m=bg.querySelector("#locmsg");
      if(isNaN(lat)||lat<-66||lat>66||isNaN(lng)||lng<-180||lng>180){ m.textContent="أدخل خط عرض بين ‎-66 و 66 وخط طول بين ‎-180 و 180."; m.className="locmsg err"; return; }
      const tz=bg.querySelector("#c_tz").value, near=nearestCity(lat,lng);
      S.custom={id:"custom",name:bg.querySelector("#c_name").value.trim()||"موقعي",lat,lng,tz,cc:near&&near.km<300?near.cc:"XX"};
      S.city="custom"; save(); bg.remove(); full();
    }
  });
}

const SILENCE="sounds/silence.mp3";
adhan.kind="athan"; adhan.bg=false; adhan.switching=false;
function adhanEl(){
  if(!adhan.el){ const a=new Audio(); a.preload="none";
    a.addEventListener("ended",()=>{ if(adhan.kind!=="athan") return; adhan.playing=false; syncAdhanUI(); if(S.bgAdhan) startWait(); });
    a.addEventListener("pause",()=>{ if(adhan.switching) return;
      if(adhan.kind==="athan"){ adhan.playing=false; syncAdhanUI(); } else { adhan.bg=false; bgUI(); } });
    a.addEventListener("play",()=>{ if(adhan.kind==="athan"){ if(!a.muted){ adhan.playing=true; syncAdhanUI(); } } else { adhan.bg=true; bgUI(); } });
    adhan.el=a; }
  return adhan.el;
}
function loadInto(src){ const a=adhanEl(); if(a.dataset.cur!==src){ a.src=src; a.dataset.cur=src; } return a; }
function setMS(kind){
  try{ if(!("mediaSession" in navigator) || !loc) return; const n=nextPrayer();
    navigator.mediaSession.metadata=new MediaMetadata({title: kind==="athan"?"الأذان":"في انتظار الأذان",
      artist:"مواقيت الصلاة · "+PNAME[n.k]+" "+fmt(n.at), album:loc.name, artwork:[{src:"icons/icon-512.png",sizes:"512x512",type:"image/png"}]});
    navigator.mediaSession.setActionHandler("play",()=>{ if(S.bgAdhan) startWait(); });
    navigator.mediaSession.setActionHandler("pause",()=>{ if(adhan.kind==="athan") stopAdhan(); else stopWait(); });
  }catch(e){} }
function startWait(){
  if(!S.bgAdhan) return;
  const a=adhanEl(); adhan.switching=true; adhan.kind="silence"; loadInto(SILENCE); a.loop=true; a.muted=false; a.volume=1;
  setMS("wait");

  if(p&&p.then) p.then(()=>{ adhan.switching=false; adhan.bg=true; adhan.unlocked=true; bgUI(); })
    .catch(()=>{ adhan.switching=false; adhan.bg=false; bgUI(); });
}
function stopWait(){ if(adhan.el && adhan.kind==="silence"){ adhan.switching=true; adhan.el.pause(); adhan.switching=false; } adhan.bg=false; bgUI(); }

function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("salat",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("files"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }

function setAdhanSrc(src,from,name){
  adhan.from=from; adhan.name=name||"";

  adhan.src=src; adhan.unlocked=false; }
function applyAdhan(){
  const id=S.notify.adhanId;

  else { const a=ADHANS.find(x=>x.id===id)||ADHANS[0]; if(id==="mine") S.notify.adhanId=a.id; setAdhanSrc(a.f,"site",a.n); }
}
async function loadAdhan(){
  try{ const rec=await idbDo("readonly",st=>st.get("adhan")); if(rec&&rec.blob) adhan.mine={url:URL.createObjectURL(rec.blob),name:rec.name}; }catch(e){}

async function saveAdhanFile(file){
  if(!file) return;
  if(file.size>25*1024*1024){ toast("الملف كبير جداً","اختر ملفاً أقل من 25 ميغابايت."); return; }
  try{ await idbDo("readwrite",st=>st.put({blob:file,name:file.name},"adhan")); }catch(e){}
  if(adhan.mine) try{ URL.revokeObjectURL(adhan.mine.url); }catch(e){}

  stopAdhan(); S.notify.adhanId="mine"; save(); applyAdhan(); render();
}
async function clearAdhanFile(){ try{ await idbDo("readwrite",st=>st.delete("adhan")); }catch(e){}

// Phones only let a page play audio it has already started from a tap: prime the player on the first tap.
function unlockAudio(){
  ensureAudio();
  if(S.bgAdhan){ if(!adhan.bg && !adhan.playing) startWait(); return; }
  if(!S.notify.on || S.notify.tone!=="adhan" || !adhan.src || adhan.unlocked || adhan.playing) return;
  adhan.kind="athan"; const a=loadInto(adhan.src); a.loop=false; a.muted=true; a.volume=0;
  const stop=()=>{ if(a.muted){ a.pause(); try{ a.currentTime=0; }catch(e){} } a.muted=false; a.volume=1; };
  const p=a.play(); if(p&&p.then) p.then(()=>{ adhan.unlocked=true; stop(); }).catch(stop);
  setTimeout(()=>{ if(a.muted) stop(); },400);
}
document.addEventListener("pointerdown",unlockAudio,true);
function playAdhan(){ if(!adhan.src){ chime(); return; }
  const a=adhanEl(); adhan.switching=true; adhan.kind="athan"; loadInto(adhan.src); a.loop=false; a.muted=false; a.volume=1;
  try{ a.currentTime=0; }catch(e){}
  setMS("athan");
  const p=a.play();
  if(p&&p.then) p.then(()=>{ adhan.switching=false; adhan.playing=true; syncAdhanUI(); })
    .catch(()=>{ adhan.switching=false; adhan.playing=false; chime(); if(S.bgAdhan) startWait(); }); }
function stopAdhan(){
  const wasAthan=adhan.kind==="athan";
  if(adhan.el && wasAthan){ adhan.switching=true; adhan.el.pause(); try{ adhan.el.currentTime=0; }catch(e){} adhan.switching=false; }
  adhan.playing=false; syncAdhanUI();
  if(S.bgAdhan && wasAthan) startWait(); }
function toast(title,body,stoppable){ document.querySelectorAll(".toast").forEach(x=>x.remove());
  const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","alert"); el.setAttribute("dir","rtl");
  el.innerHTML=`<div><b></b><span></span></div><button data-stop>${stoppable?"إيقاف الأذان":"حسناً"}</button>`; el.querySelector("b").textContent=title; el.querySelector("span").textContent=body;
  el.querySelector("button").onclick=()=>{ stopAdhan(); el.remove(); }; document.getElementById("app").appendChild(el);
  if(!stoppable) setTimeout(()=>el.remove(),12000); }
function liveAdhan(title,body){

function fire(title,body,isAdhan){

function checkNotify(){ if(!S.notify.on) return; const day=today.join("-"), ev=[];

    ev.push({at:T[k],key:day+k,t:"حان وقت صلاة "+PNAME[k],b:loc.name+" · "+fmt(T[k]),adhan:true});
    if(+S.notify.before>0) ev.push({at:T[k]-S.notify.before/60,key:day+k+"b",t:PNAME[k]+" بعد "+S.notify.before+" دقائق",b:"الأذان على الساعة "+fmt(T[k])}); }

const CFG={pushApi:"", publicKey:""};
let swReg=null, pushSub=null, pushBusy=false, pushMsg="", pushMsgErr=false, syncTimer=0, pushLink="";
async function loadConfig(){ try{ const r=await fetch("config.json",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j&&j.pushApi) CFG.pushApi=String(j.pushApi).replace(/\/+$/,""); if(j&&j.publicKey) CFG.publicKey=String(j.publicKey); } }catch(e){} }

function pushState(){

  if(!PUSH_OK) return "unsupported";

// text/plain keeps these "simple" requests (no CORS preflight); the server still reads JSON.
// If the phone refuses to read the server's answer, the request is sent again in "no-cors" mode:
// the server still receives it, the app just cannot read the reply.
async function api(path,body){
  const url=CFG.pushApi+"/api/"+path;
  const opts=body?{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(body),cache:"no-store"}:{cache:"no-store"};
  let r;
  try{ r=await fetch(url,opts); }
  catch(e){
    if(!body) throw e;
    await fetch(url,Object.assign({},opts,{mode:"no-cors"}));   // throws only if the network itself fails
    return {ok:true, opaque:true};
  }
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error||"HTTP")+" "+r.status+(j.message?" "+j.message:"")); return j; }
async function serverKey(){ if(CFG.publicKey) return CFG.publicKey; return (await api("key")).publicKey; }
function pushPrefs(){ const M=METHODS[methodKey(loc)];

    asr:S.asr, adj:S.adj, tzFix:S.tzFix, per:S.notify.per, before:+S.notify.before, athkar:!!S.notify.athkar, friday:!!S.notify.friday}; }

async function enablePush(){

  if(perm!=="granted"){ pushBusy=false; setPushMsg("لم يُسمح بالإشعارات. فعّلها من إعدادات الهاتف ← الإشعارات ← مواقيت.",true); render(); return; }

    step="key"; const publicKey=await serverKey(), appKey=unb64u(publicKey);
    step="apple";

      try{ pushSub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:appKey}); }
      catch(e1){ const old=await reg.pushManager.getSubscription(); if(old) await old.unsubscribe();
        pushSub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:appKey}); }

    S.push.on=true; S.notify.on=true; store.set("settings",S);

  }catch(e){

async function syncPush(force){

      <li><span>اختر «<b>إضافة إلى الشاشة الرئيسية</b>» ثم «إضافة»</span></li>
      <li><span>افتح <b>مواقيت</b> من الأيقونة الجديدة وارجع إلى هنا لتفعيل الإشعارات</span></li></ol>
      <span class="note">على iPhone لا تعمل الإشعارات إلا من التطبيق المضاف إلى الشاشة الرئيسية (iOS 16.4 أو أحدث).</span>`;
  else if(st==="frame") body=`<span class="note">الإشعارات تعمل من رابط التطبيق على GitHub، وليس داخل معاينة Claude.</span>`;
  else if(st==="unsupported") body=`<span class="note">هذا المتصفح لا يدعم الإشعارات. على iPhone حدّث النظام إلى iOS 16.4 أو أحدث.</span>`;
  else if(st==="noserver") body=`<span class="note">خادم الإشعارات لم يُربط بالتطبيق بعد.</span>`;
  else if(st==="denied") body=`<ol class="steps">
      <li><span>افتح <b>الإعدادات</b> في الهاتف ← <b>الإشعارات</b> ← <b>مواقيت</b></span></li>
      <li><span>فعّل «<b>السماح بالإشعارات</b>»، ثم ارجع واضغط «تفعيل»</span></li></ol>
      <span class="note">إن لم تجد «مواقيت» في القائمة: احذف أيقونة التطبيق من الشاشة الرئيسية، ثم أضفها من جديد عبر Safari.</span>`;
  else if(st==="off" && pushLink) body=`<a class="btn block" href="${esc(pushLink)}" target="_blank" rel="noopener" data-push-link>إكمال التفعيل عبر Safari</a>`;
  else if(st==="off") body=`<button class="btn block" data-push-on ${pushBusy?"disabled":""}>${bellSvg(true).replace('<svg','<svg width="18" height="18"')} تفعيل إشعارات الهاتف</button>`;
  else body= (pushTestLinks
      ? `<a class="btn block" href="${esc(testLink(0))}" target="_blank" rel="noopener">تجربة إشعار الهاتف الآن (Safari)</a>
         <a class="btn soft block" href="${esc(testLink(5))}" target="_blank" rel="noopener">تجربة بعد 5 ثوانٍ — أقفل الهاتف فوراً</a>`
      : `<button class="btn block" data-push-test="0" ${pushBusy?"disabled":""}>${bellSvg(true).replace('<svg','<svg width="18" height="18"')} تجربة الأذان والإشعار الآن</button>
         <button class="btn soft block" data-push-test="5" ${pushBusy?"disabled":""}>تجربة بعد 5 ثوانٍ — أقفل الهاتف فوراً</button>`)
    + `<button class="link small" data-push-off style="align-self:flex-start" ${pushBusy?"disabled":""}>إيقاف إشعارات الهاتف</button>`;
  return `<div class="push">
    <div class="push-top"><span class="ic">${bellSvg(true).replace('<svg','<svg width="20" height="20"')}</span><span class="grow"><b>إشعارات الهاتف</b><span class="small muted">تصلك في وقت كل صلاة حتى والتطبيق مغلق</span></span>${pill}</div>
    ${body}
    ${pushMsg&&st!=="denied"?`<span class="note ${pushMsgErr?"err":""}">${esc(pushMsg)}</span>`:""}
  </div>`;
}

/* ================= Events ================= */
const TABS=["prayer","qibla","athkar","calendar","settings"];
const SC=()=>document.getElementById("scroller");
function go(t){ tab=t; try{ history.replaceState(null,"","#"+t); }catch(e){} render(); SC().scrollTop=0; }
document.getElementById("cityBtn").addEventListener("click",openSheet);
document.getElementById("nav").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(b) go(b.dataset.tab); });
document.getElementById("view").addEventListener("click",e=>{
  if(e.target.closest("[data-city]")){ openSheet(); return; }
  const dn=e.target.closest("[data-done]"); if(dn){ toggleDone(dn.dataset.done); try{ navigator.vibrate&&navigator.vibrate(15); }catch(err){} const y=SC().scrollTop; render(); SC().scrollTop=y; return; }
  const qd=e.target.closest("[data-qada]"); if(qd){ const q=qada(); q[qd.dataset.qada]=Math.max(0,q[qd.dataset.qada]+(+qd.dataset.d)); store.set("qada",q); const y=SC().scrollTop; render(); SC().scrollTop=y; return; }
  const bell=e.target.closest("[data-bell]");
  if(bell){ const k=bell.dataset.bell;
    if(!alertsOn()){ S.notify.per[k]=true; S.notify.on=true; ensureAudio(); } else S.notify.per[k]=!S.notify.per[k];
    save(); render(); return; }
  if(e.target.closest("[data-cta-notify]")){
    S.notify.on=true; ensureAudio(); unlockAudio(); store.set("settings",S);
    const st=pushState(); if(st==="off"){ enablePush(); return; }
    go("settings"); setTimeout(()=>{ const h=document.getElementById("notifH"); if(h) h.scrollIntoView({behavior:"smooth"}); },50); return; }
  if(e.target.closest("[data-push-on]")){ enablePush(); return; }
  if(e.target.closest("[data-bg-start]")){ startWait(); return; }
  if(e.target.closest("[data-push-link]")){
    // The link opens Safari, which saves the subscription and sends a test notification.
    setTimeout(()=>{ S.push.on=true; S.notify.on=true; store.set("settings",S); store.set("pushSent",{p:JSON.stringify(pushPrefs()),at:Date.now()});
      pushLink=""; setPushMsg("تم إرسال الاشتراك عبر Safari. إن وصلك الإشعار التجريبي فالتفعيل ناجح."); render(); },600);
    return; }
  if(e.target.closest("[data-push-off]")){ disablePush(); return; }
  const pt=e.target.closest("[data-push-test]"); if(pt){ testPush(+pt.dataset.pushTest||0); return; }
  if(e.target.closest("[data-live-test]")){ ensureAudio(); unlockAudio(); const n=nextPrayer(); fire("حان وقت صلاة "+PNAME[n.k], loc.name+" · "+fmt(n.at), true); return; }
  const pr=e.target.closest("[data-per]"); if(pr){ S.notify.per[pr.dataset.per]=!S.notify.per[pr.dataset.per]; save(); render(); return; }
  const tn=e.target.closest("[data-tone]"); if(tn){ S.notify.tone=tn.dataset.tone; store.set("toneSet",true); save(); if(tn.dataset.tone!=="adhan") stopAdhan(); render(); return; }
  const ap=e.target.closest("[data-adhan-pick]");
  if(ap){ const id=ap.dataset.adhanPick;
    if(id===S.notify.adhanId && adhan.playing){ stopAdhan(); return; }
    stopAdhan(); S.notify.adhanId=id; save(); applyAdhan(); playAdhan(); render(); return; }
  if(e.target.closest("[data-adhan-clear]")){ clearAdhanFile(); return; }
  if(e.target.closest("#liveBtn")){ startCompass(); return; }
  const a=e.target.closest("[data-ath]"); if(a){ athTab=a.dataset.ath; render(); return; }
  if(e.target.closest("#tbBtn")){ tbTap(); return; }
  const ti=e.target.closest("[data-tbi]"); if(ti){ const s=tbState(); s.i=+ti.dataset.tbi; s.count=0; store.set("tasbih",s); render(); return; }
  const tt=e.target.closest("[data-tbt]"); if(tt){ const s=tbState(); s.target=+tt.dataset.tbt; s.count=0; store.set("tasbih",s); render(); return; }
  if(e.target.closest("[data-tbreset]")){ const s=tbState(); s.count=0; store.set("tasbih",s); render(); return; }
  const cl=e.target.closest("[data-cal]"); if(cl){ const v=+cl.dataset.cal; calShift = v===0 ? 0 : calShift+v; render(); return; }
  if(e.target.closest("[data-reset]")){ const st=athState(); athList(athTab).forEach(x=>delete st.c[x.id]); store.set("athkar",st); render(); return; }
  const dk=e.target.closest("[data-dk]");
  if(dk){ const st=athState(), id=dk.dataset.dk, max=+dk.dataset.max; let l=st.c[id]===undefined?max:st.c[id];
    l = l>0 ? l-1 : max; st.c[id]=l; store.set("athkar",st);
    try{ navigator.vibrate&&navigator.vibrate(l===0?[30,50,30]:12); }catch(err){}
    const y=SC().scrollTop; render(); SC().scrollTop=y; }
});
document.getElementById("view").addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="method") S.method=el.value;
  else if(el.id==="asr") S.asr=+el.value;
  else if(el.dataset.adj) S.adj[el.dataset.adj]=Math.max(-60,Math.min(60,parseInt(el.value)||0));
  else if(el.id==="n_on"){ S.notify.on=el.checked; if(el.checked){ ensureAudio(); unlockAudio(); } }
  else if(el.id==="adhanFile"){ saveAdhanFile(el.files&&el.files[0]); return; }
  else if(el.id==="bg_on"){ S.bgAdhan=el.checked;
    if(el.checked){ S.notify.on=true; S.notify.tone="adhan"; ensureAudio(); startWait(); } else stopWait();
    save(); render(); return; }
  else if(el.id==="tzfix") S.tzFix=+el.value;
  else if(el.id==="n_ath") S.notify.athkar=el.checked;
  else if(el.id==="n_fri") S.notify.friday=el.checked;
  else if(el.id==="n_before") S.notify.before=+el.value;
  else if(el.id==="hadj") S.hijriAdj=+el.value;
  else if(el.id==="h12") S.h12=el.checked;
  else return;
  save(); full();
});

/* ================= Clock ================= */
let lastKey="";
function updateNow(){ const p=localNow(loc.tz); nowH=p.H+p.M/60+p.s/3600;
  const ck=document.getElementById("clock"); if(ck) ck.textContent=fmt(p.H+p.M/60-0.4/60);
  const dk=p.y+"-"+p.m+"-"+p.d; if(dk!==today.join("-")){ refreshDay(); return true; }
  const mk=dk+" "+p.H+":"+p.M; if(mk!==lastKey){ lastKey=mk; return true; } return false; }
function full(){ refreshDay(); updateNow(); render(); tick(); }
setInterval(()=>{ if(updateNow()){ if(adhan.bg && adhan.kind==="silence") setMS("wait"); if(tab==="prayer"){ const y=SC().scrollTop; render(); SC().scrollTop=y; } else renderHero(); checkNotify(); } tick(); }, 1000);
// Coming back to the app (iPhone keeps it frozen in the background): refresh right away.
function silenceAll(){ if(!S.bgAdhan) stopAdhan(); document.querySelectorAll(".live-adhan").forEach(x=>x.remove()); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ silenceAll(); return; } silenceAll(); full(); quietGPS(); });
window.addEventListener("pagehide",silenceAll);

/* Location never prompts on its own: the saved position is reused, and it is refreshed
   silently only when the phone has already granted access (iPhone home-screen apps ask again each launch). */
async function geoGranted(){ try{ const p=await navigator.permissions.query({name:"geolocation"}); return p.state==="granted"; }catch(e){ return false; } }
async function quietGPS(){
  if(IN_FRAME || S.city!=="gps" || !S.gps) return;
  if(Date.now()-(S.gps.at||0) < 6*3600000) return;
  if(await geoGranted()) useGPS(true,null);
}

/* First launch: one screen that turns on notifications and location with a single tap. */
function maybeWelcome(){
  if(IN_FRAME || store.get("welcomed",false)) return;
  if(pushState()==="on"){ store.set("welcomed",true); return; }
  openWelcome();
}
function openWelcome(){
  const st=pushState(), bg=document.createElement("div"); bg.className="sheet-bg"; bg.setAttribute("dir","rtl");
  const bell=bellSvg(true).replace('<svg','<svg width="18" height="18"');
  let body;
  if(st==="install") body=`
    <h2>ثبّت التطبيق أولاً</h2>
    <p class="muted" style="margin:0">لتصلك إشعارات الصلاة على iPhone، يجب فتح التطبيق من الشاشة الرئيسية.</p>
    <ol class="steps">
      <li><span>اضغط زر المشاركة ${shareSvg} في Safari</span></li>
      <li><span>اختر «<b>إضافة إلى الشاشة الرئيسية</b>» ثم «إضافة»</span></li>
      <li><span>افتح <b>مواقيت</b> من الأيقونة الجديدة</span></li></ol>
    <button class="btn ghost block" data-w-close>فهمت</button>`;
  else if(st==="denied") body=`
    <h2>الإشعارات ممنوعة</h2>
    <ol class="steps">
      <li><span>افتح <b>الإعدادات</b> في الهاتف ← <b>الإشعارات</b> ← <b>مواقيت</b></span></li>
      <li><span>فعّل «<b>السماح بالإشعارات</b>»، ثم ارجع إلى التطبيق</span></li></ol>
    <p class="note" style="margin:0">إن لم تجد «مواقيت» في القائمة: احذف أيقونة التطبيق من الشاشة الرئيسية، ثم أضفها من جديد عبر Safari.</p>
    <button class="btn ghost block" data-w-close>حسناً</button>`;
  else body=`
    <h2>مرحباً بك</h2>
    <p class="muted" style="margin:0">لتصلك مواقيت الصلاة في وقتها، فعّل الإشعارات وحدّد موقعك مرة واحدة.</p>
    <button class="btn block" data-w-go>${bell} تفعيل الإشعارات والموقع</button>
    <div class="locmsg" id="wmsg"></div>
    <button class="btn ghost block" data-w-city>اختيار مدينة يدوياً</button>
    <button class="link small" data-w-close style="align-self:center">لاحقاً</button>`;
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div>`;
  document.getElementById("app").appendChild(bg);
  // Safari and the home-screen app keep separate storage on iPhone, so closing here never hides it in the app.
  const close=()=>{ store.set("welcomed",true); bg.remove(); };
  bg.addEventListener("click",async e=>{
    if(e.target===bg || e.target.closest("[data-w-close]")){ close(); return; }
    if(e.target.closest("[data-w-city]")){ close(); openSheet(); return; }
    const go=e.target.closest("[data-w-go]"); if(!go) return;
    go.disabled=true;
    S.notify.on=true; ensureAudio(); unlockAudio(); store.set("settings",S);
    if(pushState()==="off") await enablePush();   // the notification request comes first, straight from the tap
    const m=bg.querySelector("#wmsg");
    if(pushState()==="denied"){ m.textContent="لم يُسمح بالإشعارات. يمكنك تفعيلها لاحقاً من إعدادات الهاتف."; m.className="locmsg err"; }
    const ok=await useGPS(false,m);
    if(ok){ setTimeout(close,1200); } else go.disabled=false;
  });
}

const h0=(location.hash||"").replace("#",""); if(TABS.includes(h0)) tab=h0;
window.addEventListener("hashchange",()=>{ const x=location.hash.replace("#",""); if(x!==tab&&TABS.includes(x)){ tab=x; render(); } });
full();
loadAdhan().then(()=>{ if(tab==="settings") render(); });
initPush().then(maybeWelcome);
quietGPS();
</script>
